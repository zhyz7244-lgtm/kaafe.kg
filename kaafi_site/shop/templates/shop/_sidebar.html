{% load static %}
  <aside class="sidebar" id="sidebar">
    <a href="{% url 'home' %}" class="brand">
      <img src="{% static 'shop/logo.png' %}" width="48" height="48" alt="KAAFI" class="logo">
      <span><b>KAAFI</b><small>Books · Coffee</small></span>
    </a>
    <nav class="nav">
      <a href="{% url 'home' %}" {% if active == 'menu' %}class="active"{% endif %}>Меню</a>
      <a href="{% url 'books' %}" {% if active == 'books' %}class="active"{% endif %}>Книги</a>
      <a href="{% url 'home' %}#reviews">Отзывы</a>
      <a href="{% url 'home' %}#contacts">Контакты</a>
      <a href="{% url 'account' %}" class="acc">{% if customer %}Мой профиль · {{ customer.bonus_balance }} бонусов{% else %}Войти / Регистрация{% endif %}</a>
    </nav>
    <div class="side-foot">
      <div><svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg> {{ cafe.address }}</div>
      <div><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> {{ cafe.hours }}</div>
      <a href="{{ cafe.instagram_url }}" target="_blank" rel="noreferrer"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/></svg> {{ cafe.instagram_handle }}</a>
    </div>
  </aside>
