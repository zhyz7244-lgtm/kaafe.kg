{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Первая настройка — Kaafi</title>
  <link rel="icon" href="{% static 'shop/favicon.png' %}" type="image/png">
  <style>
    :root{--bg:#F6EEDC;--paper:#FBF6EA;--line:#E3D2A5;--ink:#2E1F16;--gold:#B8934F;--brown:#8B5E3C}
    *{box-sizing:border-box;margin:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
    .box{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(440px,100%);box-shadow:0 8px 30px rgba(46,31,22,.1)}
    img{display:block;margin:0 auto 10px;border-radius:50%}
    h1{font:700 24px "Playfair Display",Georgia,serif;text-align:center;margin-bottom:6px}
    p{color:#7A6A52;font-size:14px;text-align:center;margin-bottom:14px}
    label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#7A6A52;margin:12px 0 4px}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;outline:0}
    input:focus{border-color:var(--gold)}
    button{width:100%;border:0;border-radius:999px;padding:14px;font:700 15px inherit;background:var(--brown);color:#fff;cursor:pointer;margin-top:18px}
    .err{background:#FBE9E7;color:#B3261E;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:6px}
    small{display:block;color:#7A6A52;margin-top:6px;font-size:12px}
  </style>
</head>
<body>
<form class="box" method="post">{% csrf_token %}
  <img src="{% static 'shop/logo.png' %}" width="64" height="64" alt="">
  <h1>Добро пожаловать в Kaafi</h1>
  <p>Создайте свой аккаунт администратора. Логин и пароль придумываете вы сами — позже их можно сменить в панели («Аккаунт»).</p>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <label for="u">Логин</label><input id="u" name="username" required autofocus autocomplete="username" maxlength="150">
  <label for="p">Пароль</label><input id="p" name="password" type="password" required minlength="8" autocomplete="new-password">
  <small>Не короче 8 символов, не только цифры.</small>
  <label for="p2">Пароль ещё раз</label><input id="p2" name="password2" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit">Создать и войти</button>
</form>
</body>
</html>
